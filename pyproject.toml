[project]
name = "connect-four-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "altair>=6.3.0",
    "anywidget>=0.11.0",
    "marimo>=0.24.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.2",
    "pandas>=3.0.6",
    "pygame>=2.6.1",
    "torch>=2.13.0",
    "torchinfo>=1.8.0",
    "traitlets>=5.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model"]
